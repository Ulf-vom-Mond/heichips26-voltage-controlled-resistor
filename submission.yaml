short-description: A fully analog component with ohmic behaviour whose resistance value can be changed in accordance with an external analog control voltage.
# Please add the documentation about your project here.
# Why did you choose to create it? How does it work? How can it be tested, etc.?
# If your project requires additional external hardware, e.g. a USB port,
# please mention this so we can consider it when designing the HeiChips PCB.
long-description: |
  We implement three different approaches to accomplish this task.
  * bisectional opamp
  * floating gate
  * switched capacitor
  Each implementation will be selectable via integrated analog switches. If we can get some physical switches on the PCB that are connected to the digital pins of the chip, this would be really cool. This way, we could select each of the three implementations without reprogramming the eFPGA.

